<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ootidy</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ootdify</h1>
    <p>Post your daily fit checks</p>

    <div class="controls">
        <input type="text" placeholder="say something about the fit">
        <button id="postButton">Post</button>
    </div>

    <p id="heartCount">Hearts: 0</p>
    
    <img src="https://placehold.co/200" alt="outfit photo placeholder">
    <script src="script.js"></script>
</body>
</html>
